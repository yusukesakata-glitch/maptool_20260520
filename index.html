<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Field</title>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Field">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --ink:#111;--ink2:#666;--ink3:#aaa;
  --paper:#f5f5f5;--surface:#fff;--line:#e8e8e8;--accent2:#f0f0f0;
  --prospect:#2d6a4f;
  --alert:#c0392b;
  --r:8px;
  --sans:-apple-system,'Hiragino Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}

html,body{height:100%;font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%;}

/* ── PC LAYOUT ── */
@media(min-width:900px){
  body{overflow:hidden;}
  .app{display:flex;height:100vh;max-width:1600px;margin:0 auto;padding:28px;gap:20px;}
  .left{flex:2;display:flex;flex-direction:column;gap:14px;height:100%;}
  .right{flex:1;min-width:400px;display:flex;flex-direction:column;height:100%;overflow-y:auto;}
  .map-wrap{flex:1;border-radius:var(--r);overflow:hidden;position:relative;border:1px solid var(--line);}
  .mobile-bar{display:none;}
}

/* ── MOBILE LAYOUT ── */
@media(max-width:899px){
  body{overflow:hidden;height:100vh;}
  .app{display:block;height:100vh;}
  .left{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;}
  .left.hide{display:none!important;}
  .map-wrap{flex:1;overflow:hidden;border-radius:0;border:none;position:relative;margin-bottom:calc(52px + var(--sb));}
  .right{position:fixed;inset:0;z-index:2;display:none!important;flex-direction:column;background:var(--paper);overflow-y:auto;padding-bottom:calc(52px + var(--sb));}
  .right.show{display:flex!important;}
  .mobile-bar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:9999;
    background:rgba(245,245,245,.97);border-top:1px solid var(--line);
    padding-bottom:var(--sb);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .mbar-btn{
    flex:1;min-height:52px;border:none;background:none;cursor:pointer;
    font-family:var(--sans);font-size:.72rem;color:var(--ink3);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  }
  .mbar-btn.on{color:var(--ink);font-weight:600;}
  .mbar-btn svg{width:20px;height:20px;fill:currentColor;}
}

/* ── MAP ── */
#gmap{width:100%;height:100%;}
#map-msg{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(255,255,255,.95);padding:20px 24px;border-radius:var(--r);
  font-size:.82rem;color:var(--ink2);text-align:center;pointer-events:none;border:1px solid var(--line);
}

/* Map top bar: search + GPS in same row */
.map-topbar{
  position:absolute;top:12px;left:12px;right:12px;z-index:10;
  display:flex;align-items:center;gap:8px;
}
.map-search{
  flex:1;height:40px;
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:0 10px 0 12px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.map-search input{
  flex:1;min-width:0;border:none!important;background:none!important;
  outline:none;font-family:var(--sans);font-size:.88rem;color:var(--ink);
  padding:0!important;border-radius:0!important;height:100%;
}
.map-search input::placeholder{color:var(--ink3);}
.map-search button{
  width:28px;height:28px;border:none;background:none;
  cursor:pointer;color:var(--ink3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.btn-gps{
  width:40px;height:40px;flex-shrink:0;
  border-radius:var(--r);
  background:rgba(255,255,255,.97);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink2);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  transition:.2s;
}
.btn-gps.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-gps svg{width:16px;height:16px;fill:currentColor;}

/* Sync toggle */
.sync-pill{
  position:absolute;bottom:12px;left:12px;z-index:10;
  background:rgba(255,255,255,.97);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 12px;
  display:flex;align-items:center;gap:8px;
  font-size:.75rem;color:var(--ink2);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.toggle-switch{position:relative;display:inline-block;width:32px;height:17px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.3s;border-radius:17px;}
.slider:before{position:absolute;content:"";height:13px;width:13px;left:2px;bottom:2px;background:#fff;transition:.3s;border-radius:50%;}
input:checked+.slider{background:var(--ink);}
input:checked+.slider:before{transform:translateX(15px);}

/* ── RIGHT PANEL HEADER ── */
.rhead{
  background:var(--surface);border-bottom:1px solid var(--line);
  flex-shrink:0;
  padding:calc(12px + var(--st)) 16px 0;
}
@media(min-width:900px){.rhead{padding:0 0 14px;background:transparent;border-bottom:none;}}

.rtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.app-title{font-family:var(--mono);font-size:.85rem;font-weight:500;letter-spacing:.15em;}
.btn-settings{
  background:none;border:1px solid var(--line);padding:7px 13px;
  border-radius:var(--r);font-size:.82rem;cursor:pointer;
  color:var(--ink2);display:flex;align-items:center;gap:6px;min-height:38px;
  font-family:var(--sans);
}
.btn-settings svg{width:14px;height:14px;fill:currentColor;}

/* tabs */
.tabs{
  display:flex;background:var(--accent2);border-radius:var(--r);
  padding:3px;margin-bottom:12px;height:44px;
}
.tab-btn{
  flex:1;height:100%;padding:0 6px;border:none;background:none;cursor:pointer;
  font-family:var(--sans);font-size:.82rem;color:var(--ink3);
  border-radius:calc(var(--r) - 2px);transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;
}
.tab-btn.on-e{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tab-btn.on-p{background:var(--surface);color:var(--prospect);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tcnt{font-family:var(--mono);font-size:.68rem;opacity:.45;}

/* ── FILTER ROW (search + pref in one line) ── */
.filter-row{
  display:flex;align-items:stretch;gap:8px;
  margin-bottom:10px;height:40px;
}
.search-wrap{
  flex:1;min-width:0;
  display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:0 10px;gap:8px;
}
.search-wrap input{
  flex:1;min-width:0;border:none!important;background:none!important;outline:none;
  font-family:var(--sans);font-size:.88rem;color:var(--ink);
  padding:0!important;border-radius:0!important;height:100%;
}
.search-wrap input::placeholder{color:var(--ink3);}
.search-wrap svg{width:14px;height:14px;fill:var(--ink3);flex-shrink:0;}
.pref-wrap{
  display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:0 10px;flex-shrink:0;
}
.pref-wrap select{
  border:none!important;background:none!important;outline:none;
  font-family:var(--sans);font-size:.82rem;color:var(--ink2);
  cursor:pointer;appearance:none;-webkit-appearance:none;
  padding:0!important;border-radius:0!important;
}

/* rep chips */
.rep-chips{
  display:flex;gap:6px;overflow-x:auto;
  padding-bottom:10px;flex-shrink:0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.rep-chips::-webkit-scrollbar{display:none;}
.rep-chip{
  padding:5px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;
  font-size:.78rem;color:var(--ink2);white-space:nowrap;
  cursor:pointer;flex-shrink:0;
}
.rep-chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
body.prospect-mode .rep-chip.on{background:var(--prospect);border-color:var(--prospect);}

/* display count + limit */
.list-meta{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:8px;font-size:.72rem;color:var(--ink3);flex-shrink:0;
}
.limit-sel{
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);color:var(--ink2);
  font-size:.72rem;padding:3px 8px;outline:none;cursor:pointer;
  font-family:var(--mono);
}

/* ── CARDS ── */
.list-area{padding:0;flex-shrink:0;}
@media(min-width:900px){.list-area{padding:0;}}

.card{
  background:var(--surface);border-radius:var(--r);
  margin:0 16px 8px;overflow:hidden;border:1px solid var(--line);
}
@media(min-width:900px){.card{margin:0 0 8px;}}
.card.prospect{border-left:3px solid var(--prospect);}

.card-top{padding:12px;display:flex;align-items:flex-start;gap:8px;}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.card-corp{font-size:.78rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-store{font-size:.88rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-id{font-size:.78rem;color:var(--ink2);display:flex;align-items:center;gap:5px;cursor:pointer;}
.card-id svg{width:11px;height:11px;fill:var(--ink3);flex-shrink:0;}
.card-alert{color:var(--alert);font-weight:600;font-size:.75rem;}
.card-addr{font-size:.78rem;color:var(--ink2);display:flex;align-items:flex-start;gap:5px;cursor:pointer;line-height:1.4;}
.card-addr svg{width:11px;height:11px;fill:var(--ink3);flex-shrink:0;margin-top:2px;}
.card-note{font-size:.72rem;color:#7c6500;background:#fffbeb;padding:5px 8px;border-radius:4px;line-height:1.4;}

.card-acts{display:flex;border-top:1px solid var(--line);}
.act-btn{
  flex:1;padding:9px 4px;border:none;border-right:1px solid var(--line);
  background:none;display:flex;align-items:center;justify-content:center;
  gap:4px;font-size:.78rem;color:var(--ink2);cursor:pointer;
  font-family:var(--sans);text-decoration:none;
}
.act-btn:last-child{border-right:none;}
.act-btn svg{width:14px;height:14px;fill:currentColor;}

.btn-more{
  display:none;margin:4px 16px 0;padding:11px;background:none;
  border:1px solid var(--line);border-radius:20px;
  font-size:.72rem;color:var(--ink2);cursor:pointer;
  font-family:var(--mono);width:calc(100% - 32px);
}
@media(min-width:900px){.btn-more{margin:4px 0 0;width:100%;}}

/* toast */
.toast{
  position:fixed;bottom:calc(60px + var(--sb));left:50%;
  transform:translateX(-50%);
  background:rgba(17,17,17,.88);color:#fff;
  padding:7px 16px;border-radius:20px;font-size:.78rem;
  white-space:nowrap;opacity:0;transition:.2s;
  pointer-events:none;z-index:99999;
}
.toast.show{opacity:1;}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(10,10,10,.5);
  display:none;justify-content:center;align-items:flex-end;
  z-index:999999;backdrop-filter:blur(4px);
}
.overlay.open{display:flex;}
@media(min-width:600px){.overlay{align-items:center;}}
.modal{
  background:var(--surface);padding:24px;
  border-radius:16px 16px 0 0;width:100%;max-width:560px;
  max-height:92vh;overflow-y:auto;
  padding-bottom:calc(24px + var(--sb));
}
@media(min-width:600px){.modal{border-radius:12px;margin:16px;padding-bottom:24px;}}
.modal h3{font-family:var(--mono);text-align:center;font-weight:500;letter-spacing:.12em;font-size:.88rem;margin-bottom:22px;}
.mlabel{display:block;font-size:.68rem;font-weight:600;color:var(--ink3);margin:14px 0 5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;}
input[type=text],input[type=password],textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r);
  box-sizing:border-box;font-size:16px;font-family:var(--sans);
  color:var(--ink);outline:none;
}
.map-search input,.search-wrap input,.pref-wrap select{
  border:none!important;background:none!important;
  border-radius:0!important;padding:0!important;
  width:auto;font-size:.88rem;
}
input:focus,textarea:focus{border-color:var(--ink);}
.btn-main{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-size:.88rem;cursor:pointer;margin-top:18px;font-family:var(--sans);}
.btn-sub{padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:.8rem;color:var(--ink2);cursor:pointer;font-family:var(--sans);}
.btn-del{width:100%;margin-top:16px;padding:10px;background:none;color:var(--ink3);border:1px solid var(--line);border-radius:var(--r);font-size:.78rem;cursor:pointer;}
.btn-del:hover{color:var(--alert);border-color:var(--alert);}
.data-tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.msec{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px;}
.msec:last-child{border-bottom:none;margin-bottom:0;}
.mode-row{display:flex;gap:14px;background:var(--accent2);padding:10px;border-radius:var(--r);margin-bottom:12px;}
.mode-lbl{display:flex;align-items:center;font-size:.8rem;cursor:pointer;color:var(--ink2);}
.mode-lbl input{margin-right:6px;accent-color:var(--ink);}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.chip{font-size:.75rem;background:var(--surface);padding:6px 13px;border-radius:20px;cursor:pointer;border:1px solid var(--line);color:var(--ink2);}
.chip-del{color:var(--ink3);font-weight:bold;margin-left:7px;cursor:pointer;}
.rep-list{max-height:140px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rep-item label{display:flex;align-items:center;gap:7px;font-size:.8rem;cursor:pointer;color:var(--ink2);}
.dtabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px;}
.dtab{padding:8px 14px;border:none;background:none;cursor:pointer;font-size:.78rem;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;}
.dtab.on{color:var(--ink);border-bottom-color:var(--ink);}
.ibox{font-size:.72rem;color:var(--ink2);background:var(--accent2);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:11px;line-height:1.7;}
.ibox strong{color:var(--ink);}
.slist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px;}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:.75rem;border-bottom:1px solid var(--line);}
.srow:last-child{border-bottom:none;}
.iw{font-family:var(--sans);max-width:240px;}
.iw-name{font-weight:600;font-size:.9rem;margin-bottom:4px;}
.iw-meta{font-size:.7rem;color:var(--ink2);background:var(--accent2);padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:5px;}
.iw-tel{font-size:.82rem;color:var(--ink);text-decoration:none;display:block;margin-bottom:4px;}
.iw-addr{font-size:.72rem;color:var(--ink2);margin-bottom:6px;line-height:1.4;}
.iw-edit{padding:6px 10px;background:var(--accent2);border:none;border-radius:3px;font-size:.72rem;cursor:pointer;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT: MAP -->
  <div class="left" id="leftPanel">
    <div class="map-wrap">
      <div id="gmap"></div>
      <div id="map-msg">APIキーを設定してください</div>
      <div class="map-topbar">
        <div class="map-search">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:var(--ink3);flex-shrink:0;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="mapSearchInput" placeholder="エリア・住所で検索…" onkeydown="if(event.key==='Enter')mapJump()">
          <button onclick="mapJump()" style="width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--ink3);display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
          </button>
        </div>
        <button class="btn-gps" id="gpsBtn" onclick="toggleGPS()">
          <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        </button>
      </div>
      <div class="sync-pill">
        <span>連動</span>
        <label class="toggle-switch">
          <input type="checkbox" id="syncToggle" onchange="toggleSync()">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- RIGHT: LIST -->
  <div class="right" id="rightPanel">
    <div class="rhead">
      <div class="rtop">
        <span class="app-title">FIELD</span>
        <button class="btn-settings" onclick="openSettings()">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.83 8.89a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          設定
        </button>
      </div>
      <div class="tabs">
        <button class="tab-btn on-e" id="tabEx" onclick="switchTab('existing')">
          <span class="tdot" style="background:#111;"></span>
          既存顧客 <span class="tcnt" id="cntEx">0</span>
        </button>
        <button class="tab-btn" id="tabPr" onclick="switchTab('prospect')">
          <span class="tdot" style="background:#2d6a4f;"></span>
          見込み <span class="tcnt" id="cntPr">0</span>
        </button>
      </div>
      <div class="filter-row">
        <div class="search-wrap">

<script>
const DB='map_db', PDB='map_db_prospect';
let db=[], pdb=[];
let map,geocoder,AME;
let markers=[], infoWin;
let syncMode=false, hlId=null, watchId=null, trackLock=false, myPin=null, isPinClick=false;
let curTab='existing', activeReps=new Set();
let targetReps=[], chips=["不在","移転","商談中","完了"];
let curLimit=100;

window.gm_authFailure=()=>{
  alert("APIキーエラー");
  localStorage.removeItem('map_apiKey');
  document.getElementById('map-msg').textContent="⚠ API Key Error";
};

const norm=s=>(s||"").replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).toLowerCase().replace(/\s+/g,"");
const pref=a=>{const m=(a||"").match(/(...??[都道府県])/);return m?m[1]:"その他";};
const log=m=>document.getElementById('logArea').textContent=m;
const curDb=()=>curTab==='existing'?db:pdb;
const showToast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);};
const copyText=t=>{if(!t)return;navigator.clipboard.writeText(t).then(()=>showToast(t+' をコピーしました')).catch(()=>alert(t));};

window.onload=()=>{
  const k=localStorage.getItem('map_apiKey');
  try{targetReps=JSON.parse(localStorage.getItem('map_treps')||'[]');}catch(e){}
  try{chips=JSON.parse(localStorage.getItem('map_chips')||JSON.stringify(chips));}catch(e){}
  try{db=JSON.parse(localStorage.getItem(DB)||'[]');}catch(e){db=[];}
  try{pdb=JSON.parse(localStorage.getItem(PDB)||'[]');}catch(e){pdb=[];}
  updateCounts(); populatePref(); render();
  if(k){document.getElementById('apiKeyInput').value=k;document.getElementById('map-msg').textContent='起動中...';setTimeout(()=>initMap(k),400);}
  else{document.getElementById('map-msg').textContent='設定からAPIキーを設定してください';}
  if(window.innerWidth<900) mobileGo('map');
  updateHint();
  // PWA SW
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
};

function mobileGo(p){
  if(window.innerWidth>=900) return;
  document.getElementById('leftPanel').classList.toggle('hide', p!=='map');
  document.getElementById('rightPanel').classList.toggle('show', p==='list');
  document.getElementById('mbarMap').classList.toggle('on', p==='map');
  document.getElementById('mbarList').classList.toggle('on', p==='list');
  if(p==='map'&&map) setTimeout(()=>google.maps.event.trigger(map,'resize'),100);
}

function switchTab(t){
  curTab=t; activeReps=new Set();
  document.getElementById('tabEx').className='tab-btn'+(t==='existing'?' on-e':'');
  document.getElementById('tabPr').className='tab-btn'+(t==='prospect'?' on-p':'');
  document.body.className=t==='prospect'?'prospect-mode':'';
  populatePref(); render();
}
function updateCounts(){
  document.getElementById('cntEx').textContent=db.length;
  document.getElementById('cntPr').textContent=pdb.length;
}

function populatePref(){
  const sel=document.getElementById('prefFilter'), cur=sel.value;
  sel.innerHTML='<option value="ALL">都道府県</option>';
  [...new Set(curDb().map(d=>pref(d.address)))].sort().forEach(p=>{
    const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);
  });
  if(cur) sel.value=cur;
}

function smartSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q) return;
  const hits=curDb().filter(d=>norm(d.name+d.r_code+d.rep_name+d.address).includes(norm(q)));
  if(hits.length===0&&geocoder&&map){
    geocoder.geocode({address:q},(res,st)=>{
      if(st==='OK'){map.setCenter(res[0].geometry.location);map.setZoom(14);if(!syncMode){document.getElementById('syncToggle').checked=true;toggleSync();}else render();if(window.innerWidth<900)mobileGo('map');}
      else alert("場所が見つかりません: "+q);
    });
  }
}
function mapJump(){
  const q=document.getElementById('mapSearchInput').value.trim();
  if(!q||!geocoder||!map){return;}
  geocoder.geocode({address:q},(res,st)=>{
    if(st==='OK'){map.setCenter(res[0].geometry.location);map.setZoom(15);if(syncMode)render();}
    else alert("場所が見つかりません");
  });
}

function changeLimit(){curLimit=document.getElementById('limitSel').value==='ALL'?999999:parseInt(document.getElementById('limitSel').value);render();}

function render(){
  const fP=document.getElementById('prefFilter').value;
  const q=norm(document.getElementById('searchInput').value);
  const src=curDb();
  let filtered=src.filter(d=>{
    if(fP!=='ALL'&&pref(d.address)!==fP) return false;
    if(q&&!norm(d.name+d.r_code+d.rep_name+d.address+(d.building||'')).includes(q)) return false;
    return true;
  });
  if(syncMode&&map){
    const c=map.getCenter();
    filtered.forEach(d=>d._d=google.maps.geometry.spherical.computeDistanceBetween(c,new google.maps.LatLng(d.lat,d.lng)));
    filtered.sort((a,b)=>a._d-b._d);
  }
  // rep chips
  const counts={};filtered.forEach(d=>counts[d.rep_name||'—']=(counts[d.rep_name||'—']||0)+1);
  const rc=document.getElementById('repChips');rc.innerHTML='';
  Object.keys(counts).sort().forEach(name=>{
    const b=document.createElement('button');b.className='rep-chip'+(activeReps.has(name)?' on':'');
    b.textContent=name+' '+counts[name];
    b.onclick=()=>{if(activeReps.has(name))activeReps.delete(name);else activeReps.add(name);render();};
    rc.appendChild(b);
  });
  let targets=activeReps.size?filtered.filter(d=>activeReps.has(d.rep_name||'—')):filtered;
  document.getElementById('listCount').textContent=targets.length+'件';
  const display=targets.slice(0,curLimit);
  renderPins(display);
  const area=document.getElementById('listArea');area.innerHTML='';
  const isP=curTab==='prospect';
  display.forEach(c=>{
    const isMe=targetReps.includes(c.rep_name);
    const color=isP?'#2d6a4f':(isMe?'#4472b8':'#111');
    const parts=c.name.split(' ');
    const corp=parts.length>1?parts.slice(0,-1).join(' '):'';
    const store=parts.length>1?parts[parts.length-1]:c.name;
    const div=document.createElement('div');
    div.className='card'+(isP?' prospect':'');
    div.innerHTML=`
      <div class="card-top">
        <span class="cdot" style="background:${color};${hlId===c.id?'background:#e6b800;':''}"></span>
        <div class="card-body">
          ${corp?`<div class="card-corp">${corp}</div>`:''}
          <div class="card-store">${store}</div>
          <div class="card-id" onclick="copyText('${c.r_code}')">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            ${c.r_code||'—'}
            ${c.credit?`<span class="card-alert">【${c.credit}】</span>`:''}
          </div>
          <div class="card-addr" onclick="copyText('${c.address}')">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span>${c.address}${c.building?' · '+c.building:''}</span>
          </div>
          ${c.note?`<div class="card-note">${c.note}</div>`:''}
        </div>
      </div>
      <div class="card-acts">
        <button class="act-btn" onclick="openEdit('${c.id}')">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          編集
        </button>
        <a href="tel:${c.tel}" class="act-btn">
          <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.053 15.053 0 0 1-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1.01A11.36 11.36 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/></svg>
          発信
        </a>
        <button class="act-btn" onclick="jumpPin('${c.id}',${c.lat||0},${c.lng||0})">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          地図
        </button>
      </div>`;
    area.appendChild(div);
  });
  const bm=document.getElementById('btnMore');
  bm.style.display=targets.length>curLimit?'block':'none';
}

function loadMore(){curLimit+=parseInt(document.getElementById('limitSel').value)||100;render();}

function jumpPin(id,lat,lng){
  hlId=id;
  if(map){map.setZoom(17);map.panTo({lat,lng});}
  if(!syncMode){document.getElementById('syncToggle').checked=true;toggleSync();}else render();
  if(window.innerWidth<900)mobileGo('map');
}

function renderPins(display){
  if(!map||!AME) return;
  markers.forEach(m=>m.setMap(null));markers=[];
  const bounds=new google.maps.LatLngBounds();let hasPins=false;
  const q=norm(document.getElementById('searchInput').value);
  const isP=curTab==='prospect';
  const grouped={};
  display.forEach(c=>{
    if(c.lat&&c.lng){const k=`${c.lat.toFixed(5)},${c.lng.toFixed(5)}`;if(!grouped[k])grouped[k]=[];grouped[k].push(c);}
  });
  Object.keys(grouped).forEach(k=>{
    const grp=grouped[k];const f=grp[0];
    const isMe=grp.some(c=>targetReps.includes(c.rep_name));
    const isHit=q&&grp.some(c=>norm(c.name+c.r_code).includes(q));
    const isHL=grp.some(c=>c.id===hlId);
    const sz=(isHit||isHL)?18:12;
    const pin=document.createElement('div');
    pin.style.cssText=`width:${sz}px;height:${sz}px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);`;
    let bg=isP?'#2d6a4f':'#111';
    if(isHL||isHit)bg='#e6b800';
    else if(isMe)bg='#4472b8';
    pin.style.background=bg;
    if(q&&!isHit&&!isHL)pin.style.opacity='.4';
    const m=new AME({position:{lat:f.lat,lng:f.lng},map,content:pin,zIndex:(isHL||isHit)?1000:(isMe?100:1)});
    m.addListener('click',()=>{
      isPinClick=true;
      let html='<div class="iw">';
      grp.forEach(c=>{
        html+=`<div style="margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:10px;">
          <div class="iw-name">${c.name}${c.credit?` <span style="color:var(--alert);font-size:.72rem;">【${c.credit}】</span>`:''}</div>
          <div class="iw-meta">${c.rep_name||''} · ${c.r_code||''}</div>
          ${c.tel?`<a href="tel:${c.tel}" class="iw-tel">${c.tel}</a>`:''}
          <div class="iw-addr">${c.address}</div>
          ${c.note?`<div style="font-size:.7rem;color:#7c6500;background:#fffbeb;padding:3px 6px;border-radius:2px;margin-bottom:4px;">${c.note}</div>`:''}
          <button class="iw-edit" onclick="openEdit('${c.id}')">編集</button>
        </div>`;
      });
      html+='</div>';
      infoWin.setContent(html);infoWin.open(map,m);
    });
    markers.push(m);bounds.extend(m.position);hasPins=true;
  });
  if(hasPins&&!syncMode&&!watchId)map.fitBounds(bounds);
}

async function initMap(key){
  if(map) return;
  if(!window.google||!window.google.maps){
    await new Promise((res,rej)=>{
      if(document.querySelector('script[src*="maps.googleapis"]')){setTimeout(res,1000);return;}
      const s=document.createElement('script');
      s.src=`https://maps.googleapis.com/maps/api/js?key=${key}&loading=async&libraries=places,geocoding,geometry,marker`;
      s.async=true;s.onload=res;s.onerror=rej;
      document.head.appendChild(s);
    });
  }
  try{
    const{Map}=await google.maps.importLibrary("maps");
    const{Geocoder}=await google.maps.importLibrary("geocoding");
    const{AdvancedMarkerElement:AM}=await google.maps.importLibrary("marker");
    geocoder=new Geocoder();AME=AM;
    map=new Map(document.getElementById('gmap'),{
      center:{lat:35.68,lng:139.76},zoom:13,
      mapTypeControl:false,streetViewControl:false,fullscreenControl:false,
    });
    infoWin=new google.maps.InfoWindow();
    map.addListener('idle',()=>{if(!isPinClick&&syncMode)render();isPinClick=false;});
    map.addListener('dragstart',()=>{if(watchId){trackLock=false;updateGpsBtn();}});
    map.addListener('click',()=>{if(hlId){hlId=null;render();}if(infoWin)infoWin.close();});
    document.getElementById('map-msg').style.display='none';
    if(db.length||pdb.length)render();
  }catch(e){document.getElementById('map-msg').textContent='初期化失敗（リロード推奨）';}
}

function toggleSync(){syncMode=document.getElementById('syncToggle').checked;if(syncMode)render();}

function toggleGPS(){
  if(!navigator.geolocation)return alert("位置情報が使えません");
  if(!map)return alert("先にAPIキーを設定してください");
  if(watchId){
    if(trackLock){navigator.geolocation.clearWatch(watchId);watchId=null;trackLock=false;if(myPin){myPin.setMap(null);myPin=null;}}
    else{trackLock=true;if(myPin)map.panTo(myPin.position);}
  }else{
    trackLock=true;
    watchId=navigator.geolocation.watchPosition(pos=>{
      const loc={lat:pos.coords.latitude,lng:pos.coords.longitude};
      if(myPin){myPin.position=loc;}else{
        const p=document.createElement('div');
        p.style.cssText='width:14px;height:14px;border-radius:50%;background:#4285F4;border:3px solid white;';
        myPin=new AME({map,position:loc,content:p,title:"現在地",zIndex:999});
      }
      if(trackLock)map.panTo(loc);
      if(syncMode)render();
    },()=>alert("GPSエラー"),{enableHighAccuracy:true});
  }
  updateGpsBtn();
}
function updateGpsBtn(){
  const b=document.getElementById('gpsBtn');
  b.className='btn-gps'+(watchId&&trackLock?' on':'');
}

// ── EDIT ──
function openEdit(id){
  const d=curDb().find(x=>x.id===id);if(!d)return;
  document.getElementById('eid').value=d.id;
  document.getElementById('etype').value=curTab;
  document.getElementById('eorigAddr').value=d.address||'';
  document.getElementById('enote').value=d.note||'';
  document.getElementById('ecredit').value=d.credit||'';
  document.getElementById('erep').value=d.rep_name||'';
  document.getElementById('er').value=d.r_code||'';
  document.getElementById('ename').value=d.name||'';
  document.getElementById('ebuilding').value=d.building||'';
  document.getElementById('etel').value=d.tel||'';
  document.getElementById('eaddr').value=d.address||'';
  const ca=document.getElementById('editChips');ca.innerHTML='';
  chips.forEach(t=>{
    const b=document.createElement('button');b.className='chip';b.textContent=t;
    b.onclick=()=>{const n=document.getElementById('enote');n.value=(n.value?n.value+' ':'')+t;};
    ca.appendChild(b);
  });
  const clr=document.createElement('button');clr.className='chip';clr.textContent='クリア';
  clr.onclick=()=>document.getElementById('enote').value='';ca.appendChild(clr);
  document.getElementById('editOverlay').classList.add('open');
}
function closeEdit(){document.getElementById('editOverlay').classList.remove('open');}
async function saveEdit(){
  const id=document.getElementById('eid').value;
  const type=document.getElementById('etype').value;
  const tdb=type==='existing'?db:pdb;
  const idx=tdb.findIndex(x=>x.id===id);if(idx<0)return;
  const newAddr=document.getElementById('eaddr').value.trim();
  const oldAddr=document.getElementById('eorigAddr').value;
  tdb[idx].note=document.getElementById('enote').value;
  tdb[idx].credit=document.getElementById('ecredit').value;
  tdb[idx].rep_name=document.getElementById('erep').value;
  tdb[idx].r_code=document.getElementById('er').value;
  tdb[idx].name=document.getElementById('ename').value;
  tdb[idx].building=document.getElementById('ebuilding').value;
  tdb[idx].tel=document.getElementById('etel').value;
  tdb[idx].address=newAddr;
  if(newAddr!==oldAddr&&newAddr&&geocoder){
    try{
      const c=await new Promise((res,rej)=>geocoder.geocode({address:newAddr},(r,s)=>s==='OK'?res({lat:r[0].geometry.location.lat(),lng:r[0].geometry.location.lng()}):rej(s)));
      tdb[idx].lat=c.lat;tdb[idx].lng=c.lng;
    }catch(e){alert("住所のジオコーディング失敗。テキストのみ更新します。");}
  }
  saveDB(type);populatePref();render();closeEdit();
}
function delEntry(){
  if(!confirm("削除しますか？"))return;
  const id=document.getElementById('eid').value;
  const type=document.getElementById('etype').value;
  if(type==='existing')db=db.filter(x=>x.id!==id);
  else pdb=pdb.filter(x=>x.id!==id);
  saveDB(type);updateCounts();render();closeEdit();
}

// ── SETTINGS ──
function openSettings(){
  const grid=document.getElementById('repList');grid.innerHTML='';
  [...new Set([...db,...pdb].map(d=>d.rep_name||'担当なし'))].sort().forEach(name=>{
    const div=document.createElement('div');div.className='rep-item';
    div.innerHTML=`<label><input type="checkbox" value="${name}" ${targetReps.includes(name)?'checked':''} onchange="toggleRep(this)"> ${name}</label>`;
    grid.appendChild(div);
  });
  renderChips();
  const sl=document.getElementById('storageList');sl.innerHTML='';
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k.startsWith('map_db'))continue;
    let cnt='?';try{cnt=JSON.parse(localStorage.getItem(k)).length+'件';}catch(e){}
    const row=document.createElement('div');row.className='srow';
    row.innerHTML=`<span>${k} <span style="color:var(--ink3);font-size:.65rem;font-family:var(--mono);">${cnt}</span></span><button onclick="forceDelete('${k}')" style="font-size:.68rem;padding:2px 8px;border:1px solid var(--line);border-radius:2px;background:none;cursor:pointer;color:var(--ink3);">削除</button>`;
    sl.appendChild(row);
  }
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('open');}
function switchDTab(t){
  document.getElementById('dsEx').style.display=t==='ex'?'block':'none';
  document.getElementById('dsPr').style.display=t==='pr'?'block':'none';
  document.getElementById('dtEx').classList.toggle('on',t==='ex');
  document.getElementById('dtPr').classList.toggle('on',t==='pr');
}
function toggleRep(cb){
  if(cb.checked){if(!targetReps.includes(cb.value))targetReps.push(cb.value);}
  else{targetReps=targetReps.filter(n=>n!==cb.value);}
  localStorage.setItem('map_treps',JSON.stringify(targetReps));render();
}
function renderChips(){
  const c=document.getElementById('chipList');c.innerHTML='';
  chips.forEach((ch,i)=>{
    const b=document.createElement('button');b.className='chip';
    b.innerHTML=`${ch} <span class="chip-del" onclick="delChip(${i})">×</span>`;
    c.appendChild(b);
  });
}
function addChip(){const inp=document.getElementById('newChip'),v=inp.value.trim();if(v){chips.push(v);localStorage.setItem('map_chips',JSON.stringify(chips));inp.value='';renderChips();}}
function delChip(i){if(confirm("削除しますか？")){chips.splice(i,1);localStorage.setItem('map_chips',JSON.stringify(chips));renderChips();}}
function forceDelete(k){
  if(!confirm(`"${k}" を削除しますか？`))return;
  localStorage.removeItem(k);
  if(k===DB){db=[];updateCounts();render();renderPins([]);}
  if(k===PDB){pdb=[];updateCounts();render();}
  openSettings();alert("削除しました");
}
async function saveKey(){
  const k=document.getElementById('apiKeyInput').value.trim();
  if(!k)return alert("キーを入力してください");
  localStorage.setItem('map_apiKey',k);
  await initMap(k);alert("保存しました");
}
function updateHint(){
  const mode=document.querySelector('input[name="regMode"]:checked').value;
  const wrap=document.getElementById('updOpts');
  const lbl=document.getElementById('csvLbl');
  const inp=document.getElementById('csvInput');
  if(mode==='update'){
    wrap.style.display='block';
    lbl.textContent='データ貼り付け（ID + 更新値）';
    inp.placeholder='R001\t新しい値\nR002\t新しい値';
  }else{
    wrap.style.display='none';
    lbl.textContent='データ貼り付け（kintoneからコピー&ペースト）';
    inp.placeholder='現在担当\t顧客No\t法人名\t窓口店舗名\t住所\t...\n坂田 悠介\tR001\t...';
  }
}

// ── HEADER AUTO-MAP ──
const HMAP={'現在担当':'rep_name','顧客no':'r_code','顧客no.':'r_code','法人名':'corp_name','窓口店舗名':'store_name','店舗名':'store_name','住所':'address','ビル名':'building','tel':'tel','電話':'tel','責任者tel/携帯':'tel','責任者tel':'tel','与信':'credit','メモ':'note','責任者メモ':'note'};
function buildColMap(firstLine){
  const cols=firstLine.split(/\t/).map(s=>s.trim().toLowerCase());
  if(!cols.some(c=>c.includes('顧客')||c.includes('現在担当')))return null;
  const m={};cols.forEach((h,i)=>{const k=h.replace(/\s/g,'');if(HMAP[k])m[HMAP[k]]=i;});return m;
}
function getCol(cols,field,fb,cm){
  if(cm&&cm[field]!==undefined)return(cols[cm[field]]||'').trim();
  return(cols[fb]||'').trim();
}

async function processData(){
  const mode=document.querySelector('input[name="regMode"]:checked').value;
  const csv=document.getElementById('csvInput').value.trim();
  if(!csv)return alert('データを貼り付けてください');
  const btn=document.getElementById('runBtn');btn.disabled=true;btn.textContent='処理中...';
  if(mode==='update'){
    try{
      const field=document.getElementById('updTarget').value;
      let n=0;
      csv.split('\n').forEach(line=>{const cols=line.trim().split(/\t/).map(s=>s.trim());if(cols.length<2)return;const t=db.find(d=>d.r_code===cols[0]);if(t){t[field]=cols[1];n++;}});
      saveDB('existing');render();alert(n+'件更新しました');
    }finally{btn.disabled=false;btn.textContent='取り込み実行';}
  }else{
    try{
      await initMap(localStorage.getItem('map_apiKey'));
      const lines=csv.split('\n').filter(l=>l.trim());
      let cm=buildColMap(lines[0]),start=cm?1:0,cnt=0,upd=0,skip=0;
      for(let i=start;i<lines.length;i++){
        const cols=lines[i].split(/\t/).map(s=>s.trim());if(cols.length<3)continue;
        const rep=getCol(cols,'rep_name',0,cm),r=getCol(cols,'r_code',1,cm),corp=getCol(cols,'corp_name',4,cm),store=getCol(cols,'store_name',5,cm),addr=getCol(cols,'address',6,cm),build=getCol(cols,'building',cm?999:5,cm),tel=getCol(cols,'tel',8,cm),credit=getCol(cols,'credit',cm?999:7,cm),note=getCol(cols,'note',99,cm);
        if(!r||!addr){skip++;continue;}
        const name=(corp+' '+store).trim();
        const ex=db.find(d=>d.r_code===r);
        if(ex){ex.name=name;ex.building=build;ex.address=addr;ex.tel=tel;ex.credit=credit;ex.rep_name=rep;if(note)ex.note=note;upd++;}
        else{try{const c=await new Promise((res,rej)=>geocoder.geocode({address:addr},(r,s)=>s==='OK'?res({lat:r[0].geometry.location.lat(),lng:r[0].geometry.location.lng()}):rej(s)));db.push({id:Math.random().toString(36).substr(2,9),r_code:r,name,building:build,address:addr,tel,lat:c.lat,lng:c.lng,rep_name:rep,note,credit});cnt++;log(`新規:${cnt} 更新:${upd}`);}catch(e){skip++;}await new Promise(r=>setTimeout(r,400));}
      }
      saveDB('existing');updateCounts();populatePref();render();
      alert(`完了: 新規${cnt}件 / 更新${upd}件`+(skip?` / スキップ${skip}件`:''));
    }finally{btn.disabled=false;btn.textContent='取り込み実行';}
  }
}

async function processProspect(){
  const csv=document.getElementById('prospectInput').value.trim();
  if(!csv)return alert('データを貼り付けてください');
  const btn=document.getElementById('runBtnPr');btn.disabled=true;btn.textContent='処理中...';
  try{
    await initMap(localStorage.getItem('map_apiKey'));
    const lines=csv.split('\n').filter(l=>l.trim());
    let cm=buildColMap(lines[0]),start=cm?1:0,cnt=0,upd=0,skip=0;
    for(let i=start;i<lines.length;i++){
      const cols=lines[i].split(/\t/).map(s=>s.trim());if(cols.length<3)continue;
      const rep=getCol(cols,'rep_name',0,cm),r=getCol(cols,'r_code',1,cm),corp=getCol(cols,'corp_name',4,cm),store=getCol(cols,'store_name',5,cm),addr=getCol(cols,'address',6,cm),build=getCol(cols,'building',cm?999:5,cm),tel=getCol(cols,'tel',8,cm),credit=getCol(cols,'credit',cm?999:7,cm),note=getCol(cols,'note',99,cm);
      if(!r||!addr){skip++;continue;}
      const name=(corp+' '+store).trim();
      const ex=pdb.find(d=>d.r_code===r);
      if(ex){ex.name=name;ex.building=build;ex.address=addr;ex.tel=tel;ex.credit=credit;ex.rep_name=rep;if(note)ex.note=note;upd++;}
      else{try{const c=await new Promise((res,rej)=>geocoder.geocode({address:addr},(r,s)=>s==='OK'?res({lat:r[0].geometry.location.lat(),lng:r[0].geometry.location.lng()}):rej(s)));pdb.push({id:Math.random().toString(36).substr(2,9),r_code:r,name,building:build,address:addr,tel,lat:c.lat,lng:c.lng,rep_name:rep,note,credit,isProspect:true});cnt++;log(`新規:${cnt} 更新:${upd}`);}catch(e){skip++;}await new Promise(r=>setTimeout(r,400));}
    }
    saveDB('prospect');updateCounts();populatePref();render();
    alert(`完了: 新規${cnt}件 / 更新${upd}件`+(skip?` / スキップ${skip}件`:''));
  }finally{btn.disabled=false;btn.textContent='見込み顧客を取り込む';}
}

function saveDB(t){if(t==='existing')localStorage.setItem(DB,JSON.stringify(db));if(t==='prospect')localStorage.setItem(PDB,JSON.stringify(pdb));}
function doExport(t,fmt){
  const data=t==='existing'?db:pdb;if(!data.length)return alert('データがありません');
  if(fmt==='json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=`${t==='existing'?'map_data':'prospect_data'}.json`;a.click();}
  else{const hdr='ID,社名店名,住所,ビル名,電話,与信,メモ,担当者';const rows=data.map(d=>[d.r_code,d.name,d.address,d.building,d.tel,d.credit,d.note,d.rep_name].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+[hdr,...rows].join('\n')],{type:'text/csv;charset=utf-8;'}));a.download=`${t==='existing'?'顧客':'見込み'}_${new Date().toISOString().slice(0,10)}.csv`;a.click();}
}
function doImport(inp,t){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{try{if(confirm("読み込みますか？")){const p=JSON.parse(e.target.result);if(t==='existing'){db=p;saveDB('existing');}else{pdb=p;saveDB('prospect');}updateCounts();populatePref();render();alert("読み込み完了");}}catch(z){alert("読み込み失敗");}};r.readAsText(f);
}
function clearDB(t){if(!confirm(`${t==='existing'?'既存顧客':'見込み顧客'}データを全削除しますか？`))return;if(t==='existing'){db=[];saveDB('existing');}else{pdb=[];saveDB('prospect');}updateCounts();render();renderPins([]);}
</script>
