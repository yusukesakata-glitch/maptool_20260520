<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Field">
    <meta name="theme-color" content="#111111">
    <link rel="manifest" href="manifest.json">
    <title>顧客マップDB Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">

    <style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --ink:#111;--ink2:#666;--ink3:#aaa;
  --paper:#f5f5f5;--surface:#fff;--line:#e8e8e8;--accent2:#f0f0f0;
  --gold:#111;--gold-light:#f0f0f0;
  --prospect-color:#2d6a4f;--prospect-light:#eef6f1;
  --alert:#c0392b;--dark:#111;--border:#e8e8e8;
  --radius:8px;--shadow:0 2px 12px rgba(0,0,0,.06);
  --font-serif:-apple-system,'Hiragino Sans',sans-serif;
  --font-eng:'DM Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');

html,body{height:100%;font-family:var(--font-serif);background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%;}
body{overflow-y:auto;}
.svg-icon{width:1.1em;height:1.1em;fill:currentColor;vertical-align:middle;}

/* ── LAYOUT ── */
.app-container{display:flex;flex-direction:column;max-width:1600px;margin:0 auto;padding:20px;gap:20px;}
@media(min-width:900px){
  body{overflow:hidden;}
  .app-container{flex-direction:row;padding:28px;height:100vh;}
  .left-section{flex:2;display:flex;flex-direction:column;gap:14px;height:100%;}
  .right-section{flex:1;display:flex;flex-direction:column;height:100%;min-width:400px;overflow-y:auto;padding-right:4px;}
  .map-wrapper{flex:1;border-radius:var(--radius);overflow:hidden;position:relative;border:1px solid var(--line);box-shadow:var(--shadow);}
}
@media(max-width:899px){
  body{overflow:hidden;height:100vh;}
  .app-container{display:block;padding:0;height:100vh;overflow:hidden;}
  .left-section{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:0;height:100vh;}
  .left-section.mob-hidden{display:none !important;}
  .left-section .map-wrapper{margin-bottom:calc(54px + var(--safe-bottom));}
  .map-wrapper{flex:1;height:auto;min-height:unset;border-radius:0;margin-bottom:0;border:none;box-shadow:none;}
  .right-section{position:fixed;inset:0;z-index:2;display:none !important;flex-direction:column;height:100vh;overflow-y:auto;background:var(--paper);padding:0 0 calc(70px + var(--safe-bottom));}
  .right-section.mob-visible{display:flex !important;}
  .mobile-bar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:99999;background:rgba(245,245,245,.97);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .mbar-btn{flex:1;min-height:54px;padding:10px 0;border:none;background:none;cursor:pointer;font-family:var(--font-serif);font-size:.7rem;color:var(--ink3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.15s;}
  .mbar-btn.active{color:var(--ink);font-weight:600;}
  .mbar-btn svg{width:20px;height:20px;fill:currentColor;}
  .search-row{display:none !important;}
}
@media(min-width:900px){.mobile-bar{display:none;}}

/* ── HEADER ── */
.header-area{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 14px;border-bottom:1px solid var(--line);flex-shrink:0;}
@media(min-width:900px){.header-area{padding:0 0 14px;}}
h1{font-family:var(--font-eng);font-size:.85rem;font-weight:500;letter-spacing:.15em;color:var(--ink);}
.btn-settings{background:none;border:1px solid var(--line);padding:8px 14px;border-radius:var(--radius);font-family:var(--font-serif);font-size:.82rem;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:7px;transition:.2s;min-height:40px;}
.btn-settings:hover{border-color:var(--ink);color:var(--ink);}

/* ── TABS ── */
.main-tabs{display:flex;background:var(--accent2);border-radius:var(--radius);padding:3px;margin:0 20px 14px;flex-shrink:0;}
@media(min-width:900px){.main-tabs{margin:0 0 14px;}}
.main-tab-btn{flex:1;padding:9px 6px;border:none;background:none;cursor:pointer;font-family:var(--font-serif);font-size:.8rem;color:var(--ink3);border-radius:calc(var(--radius)-2px);transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;}
.main-tab-btn.active-existing{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.main-tab-btn.active-prospect{background:var(--surface);color:var(--prospect-color);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tab-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tab-count{font-family:var(--font-eng);font-size:.65rem;opacity:.5;}

/* ── FILTERS ── */
.filter-full{padding:0 20px 12px;flex-shrink:0;}
@media(min-width:900px){.filter-full{padding:0 0 12px;}}
select{width:100%;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font-serif);font-size:.85rem;appearance:none;-webkit-appearance:none;cursor:pointer;outline:none;box-shadow:var(--shadow);}
select:focus{border-color:var(--ink);}

/* ── SEARCH ── */
.list-search-box,.search-box-style{display:flex;align-items:center;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);margin:0 20px 14px;flex-shrink:0;}
@media(min-width:900px){.list-search-box,.search-box-style{margin:0 0 14px;}}
.search-input-style{flex:1;border:none;padding:12px 14px;font-size:.9rem;background:transparent;outline:none;font-family:var(--font-serif);color:var(--ink);min-width:0;}
.search-input-style::placeholder{color:var(--ink3);}
.search-btn-style{background:none;border:none;padding:0 12px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;}

/* ── STATS ── */
#stats-area{background:var(--surface);padding:14px 16px;border-radius:var(--radius);margin:0 20px 14px;border:1px solid var(--line);box-shadow:var(--shadow);flex-shrink:0;}
@media(min-width:900px){#stats-area{margin:0 0 14px;}}
.stats-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.stats-total{font-family:var(--font-eng);font-weight:500;font-size:.82rem;color:var(--ink);}
.limit-select{padding:4px 8px;border-radius:var(--radius);border:1px solid var(--line);font-size:.72rem;background:var(--surface);color:var(--ink2);font-family:var(--font-eng);outline:none;box-shadow:none;}
#display-count-text{font-size:.7rem;color:var(--ink3);margin-bottom:8px;font-family:var(--font-eng);}
.stats-grid{display:flex;flex-wrap:wrap;gap:6px;}
.stats-item{font-size:.72rem;padding:5px 11px;background:var(--accent2);border-radius:20px;cursor:pointer;border:1px solid var(--line);transition:.15s;color:var(--ink2);}
.stats-item.selected{background:var(--ink);color:#fff;border-color:var(--ink);}
body.prospect-mode .stats-item.selected{background:var(--prospect-color);border-color:var(--prospect-color);}
.stats-count{font-family:var(--font-eng);margin-left:3px;font-size:.68rem;}

/* ── CARDS ── */
#result-area{padding:0 20px;flex-shrink:0;}
@media(min-width:900px){#result-area{padding:0;}}
.customer-item{background:var(--surface);padding:16px;border-radius:var(--radius);margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);transition:.15s;}
.customer-item.prospect-item{border-left:3px solid var(--prospect-color);}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;margin-top:5px;}
.info-main{font-weight:600;font-size:.92rem;margin-bottom:6px;color:var(--ink);line-height:1.4;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.info-sub{font-size:.78rem;color:var(--ink2);margin-bottom:5px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;line-height:1.5;}
.credit-alert{color:var(--alert);font-weight:600;white-space:nowrap;font-size:.72rem;}
.tag{background:var(--accent2);padding:2px 8px;border-radius:4px;font-size:.68rem;color:var(--ink2);border:1px solid var(--line);}
.tag-id{background:#f0f0f0;color:#444;border-color:#ddd;}
.tag-id-prospect{background:var(--prospect-light);color:var(--prospect-color);border-color:#b2d4bb;}
.confidence-badge{font-size:.68rem;padding:2px 7px;border-radius:4px;font-weight:500;}
.confidence-high{background:#e8f5e9;color:#1b5e20;}
.confidence-mid{background:#fff8e1;color:#e65100;}
.confidence-low{background:#f5f5f5;color:var(--ink3);}
.btn-copy{font-size:.62rem;background:none;border:1px solid var(--line);padding:1px 6px;border-radius:3px;cursor:pointer;color:var(--ink3);transition:.2s;}
.btn-copy:hover{border-color:var(--ink);color:var(--ink);}
.note-box{font-size:.72rem;color:#7c6500;background:#fffbeb;padding:5px 9px;border-radius:4px;margin-top:6px;display:inline-block;line-height:1.4;}

/* ── ACTION BUTTONS ── */
.action-area{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.action-btn{width:38px;height:38px;border-radius:var(--radius);background:var(--accent2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.15s;color:var(--ink2);cursor:pointer;font-family:var(--font-eng);font-size:.68rem;appearance:none;-webkit-appearance:none;line-height:1;}
.action-btn:hover,.action-btn:active{border-color:var(--ink);color:var(--ink);background:#e8e8e8;}
.action-btn svg{width:14px;height:14px;fill:currentColor;}
@media(max-width:899px){
  .customer-item{flex-direction:column;}
  .action-area{flex-direction:row;width:100%;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;}
  .action-btn{flex:1;height:40px;font-size:.75rem;gap:5px;}
}

/* ── LOAD MORE ── */
.btn-load-more{width:calc(100% - 40px);margin:4px 20px 0;padding:12px;background:none;border:1px solid var(--line);border-radius:20px;font-weight:500;cursor:pointer;font-family:var(--font-eng);font-size:.72rem;color:var(--ink2);letter-spacing:.05em;transition:.2s;}
@media(min-width:900px){.btn-load-more{width:100%;margin:4px 0 0;}}
.btn-load-more:hover{border-color:var(--ink);color:var(--ink);}

/* ── MAP ── */
#google-map-view{width:100%;height:100%;}
#map-placeholder-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.93);padding:24px 28px;border-radius:var(--radius);font-size:.82rem;color:var(--ink2);pointer-events:none;text-align:center;font-family:var(--font-serif);border:1px solid var(--line);line-height:1.6;}
.map-sync-wrapper{position:absolute;top:14px;right:62px;z-index:10;background:rgba(255,255,255,.95);padding:5px 12px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;gap:7px;font-family:var(--font-serif);font-size:.75rem;color:var(--ink2);border:1px solid var(--line);}
.toggle-switch{position:relative;display:inline-block;width:32px;height:17px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.3s;border-radius:17px;}
.slider:before{position:absolute;content:"";height:13px;width:13px;left:2px;bottom:2px;background:#fff;transition:.3s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);}
input:checked+.slider{background:var(--ink);}
input:checked+.slider:before{transform:translateX(15px);}
.btn-current-loc{position:absolute;top:10px;right:14px;z-index:10;width:44px;height:44px;background:rgba(255,255,255,.95);border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.1);border:1px solid var(--line);color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
.btn-current-loc.locked{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-current-loc svg{width:16px;height:16px;fill:currentColor;}
.map-search-wrap{position:absolute;top:14px;left:14px;right:66px;z-index:10;display:flex;align-items:center;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:20px;padding:0 8px 0 14px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.map-search-wrap input{flex:1;border:none;background:none;outline:none;font-family:var(--font-serif);font-size:.88rem;color:var(--ink);padding:10px 0;min-width:0;}
.map-search-wrap input::placeholder{color:var(--ink3);}
.map-search-wrap button{width:32px;height:32px;border:none;background:none;cursor:pointer;color:var(--ink3);display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s;flex-shrink:0;}
.map-search-wrap button:hover{background:var(--accent2);color:var(--ink);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,.5);display:none;justify-content:center;align-items:flex-end;z-index:999999;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.modal-overlay[style*="flex"]{display:flex !important;}
@media(min-width:600px){.modal-overlay{align-items:center;}}
.modal-content{background:var(--surface);padding:24px;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(0,0,0,.12);padding-bottom:calc(24px + var(--safe-bottom));}
@media(min-width:600px){.modal-content{border-radius:12px;margin:16px;padding-bottom:24px;}}
.modal-content h3{font-family:var(--font-eng);text-align:center;margin-top:0;font-weight:500;letter-spacing:.12em;color:var(--ink);margin-bottom:22px;font-size:.85rem;}
label{display:block;font-size:.68rem;font-weight:600;color:var(--ink3);margin-bottom:5px;margin-top:14px;font-family:var(--font-eng);letter-spacing:.06em;text-transform:uppercase;}
input[type="text"],input[type="password"],textarea{width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-sizing:border-box;font-size:16px;font-family:var(--font-serif);color:var(--ink);outline:none;transition:.2s;}
input[type="text"]:focus,input[type="password"]:focus,textarea:focus{border-color:var(--ink);}
.btn-main{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);font-weight:500;cursor:pointer;margin-top:18px;font-family:var(--font-serif);font-size:.88rem;transition:.2s;}
.btn-main:hover{opacity:.85;}
.btn-sub{padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);font-weight:400;cursor:pointer;font-size:.8rem;color:var(--ink2);font-family:var(--font-serif);transition:.2s;}
.btn-sub:hover{border-color:var(--ink);color:var(--ink);}
.btn-del{width:100%;margin-top:16px;padding:10px;background:none;color:var(--ink3);border:1px solid var(--line);border-radius:var(--radius);font-weight:400;cursor:pointer;font-size:.78rem;transition:.2s;}
.btn-del:hover{color:var(--alert);border-color:var(--alert);}
.data-tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.settings-section{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px;}
.settings-section:last-child{border-bottom:none;margin-bottom:0;}
.mode-switch{display:flex;gap:14px;margin-bottom:12px;background:var(--accent2);padding:10px;border-radius:var(--radius);border:1px solid var(--line);}
.mode-label{display:flex;align-items:center;font-size:.8rem;cursor:pointer;color:var(--ink2);font-family:var(--font-serif);}
.mode-label input{margin-right:6px;accent-color:var(--ink);}
.quick-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.chip{font-size:.75rem;background:var(--surface);padding:6px 13px;border-radius:20px;cursor:pointer;border:1px solid var(--line);color:var(--ink2);transition:.15s;}
.chip:hover,.chip:active{border-color:var(--ink);color:var(--ink);}
.chip-del{color:var(--ink3);font-weight:bold;margin-left:7px;cursor:pointer;}
.rep-checklist{max-height:140px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rep-checklist label{margin:0;color:var(--ink2);font-weight:400;font-family:var(--font-serif);text-transform:none;letter-spacing:0;font-size:.8rem;}
.info-window-container{font-family:var(--font-serif);padding:0 4px 4px 0;max-width:240px;max-height:240px;overflow-y:auto;}
.info-window-card{margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px;}
.info-window-card:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.info-title{font-weight:600;font-size:.9rem;margin-bottom:4px;line-height:1.3;color:var(--ink);}
.info-meta{font-size:.7rem;color:var(--ink2);margin-bottom:5px;background:var(--accent2);padding:2px 6px;border-radius:3px;display:inline-block;}
.info-tel{font-weight:500;color:var(--ink);font-size:.82rem;text-decoration:none;margin-bottom:4px;display:block;}
.info-addr{font-size:.72rem;color:var(--ink2);margin-bottom:6px;line-height:1.4;}
.info-btn{flex:1;padding:7px;border-radius:4px;text-align:center;font-size:.72rem;font-weight:500;text-decoration:none;cursor:pointer;border:none;transition:.2s;font-family:var(--font-serif);}
.btn-edit-sm{background:var(--accent2);color:var(--ink2);}
.btn-edit-sm:hover{background:#e0e0e0;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
</style>
</head>
<body>

<div class="app-container">
    <div class="left-section">
        <div class="map-wrapper">
            <div id="google-map-view"></div>
            <div id="map-placeholder-msg">マップ読込中...</div>
            <div class="map-sync-wrapper">
                <span>連動</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="mapSyncToggle" onchange="toggleMapSync()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="map-legend" id="mapLegend" style="display:none;">
                <div class="legend-item"><div class="legend-dot" style="background:#bf5b5b;"></div>既存顧客</div>
                <div class="legend-item"><div class="legend-dot" style="background:#4a7c59;"></div>見込み（確度高）</div>
                <div class="legend-item"><div class="legend-dot" style="background:#82b896;"></div>見込み（確度中）</div>
                <div class="legend-item"><div class="legend-dot" style="background:#b2cdb9;"></div>見込み（確度低）</div>
                <div class="legend-item"><div class="legend-dot" style="background:#5d7ea3;"></div>自分担当</div>
            </div>
            <button class="btn-current-loc" id="gpsBtn" onclick="toggleGPS()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            </button>
        </div>
    </div>

    <div class="right-section">
        <div class="header-area">
            <h1>FIELD</h1>
            <button class="btn-settings" onclick="openSettings()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.83 8.89a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                設定
            </button>
        </div>

        <!-- ★ メインタブ -->
        <div class="main-tabs">
            <button class="main-tab-btn active-existing" id="tab-existing" onclick="switchTab('existing')">

<script>
    const DB_NAME = "map_db";
    const PROSPECT_DB_NAME = "map_db_prospect";

    let currentLimit = 100;
    let activeReps = new Set();
    let mapSyncMode = false;
    let targetReps = [];
    let isPinClick = false;
    let myLocationMarker = null;
    let watchId = null;
    let isTrackingLocked = false;
    let quickChips = ["不在", "移転", "商談中", "完了"];
    let highlightedId = null;
    let currentTab = 'existing'; // 'existing' or 'prospect'

    let db = [];           // 既存顧客
    let prospectDb = [];   // 見込み顧客

    let map, geocoder, AdvancedMarkerElement;
    let markers = [];
    let infoWindow;

    // モバイルパネル切替
    function mobileGo(panel) {
        if(window.innerWidth >= 900) return;
        const leftEl = document.querySelector('.left-section');
        const rightEl = document.querySelector('.right-section');
        leftEl.classList.toggle('mob-hidden', panel !== 'map');
        rightEl.classList.toggle('mob-visible', panel === 'list');
        document.getElementById('mbarMap').classList.toggle('active', panel === 'map');
        document.getElementById('mbarList').classList.toggle('active', panel === 'list');
        // マップパネルに戻ったらリサイズイベントを発火してマップを再描画
        if(panel === 'map' && map) {
            setTimeout(() => google.maps.event.trigger(map, 'resize'), 100);
        }
    }

    // 地図ボタン押したらマップパネルに切替
    const _origPanToMap = null;

    window.gm_authFailure = function() {
        alert("APIキーエラーです。\n設定を確認してください。");
        document.getElementById('map-placeholder-msg').innerHTML = "⚠️ API Key Error";
        localStorage.removeItem('map_apiKey');
    };

    function normalize(s) { return (s||"").replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).toLowerCase().replace(/\s+/g,""); }
    function log(msg) { document.getElementById('log-area').innerText = msg; }

    function getCurrentDb() { return currentTab === 'existing' ? db : prospectDb; }

    // ★ タブ切替
    function switchTab(tab) {
        currentTab = tab;
        activeReps = new Set();
        document.getElementById('tab-existing').className = 'main-tab-btn' + (tab==='existing' ? ' active-existing' : '');
        document.getElementById('tab-prospect').className = 'main-tab-btn' + (tab==='prospect' ? ' active-prospect' : '');
        document.body.className = tab === 'prospect' ? 'prospect-mode' : '';
        document.getElementById('mapLegend').style.display = tab === 'prospect' ? 'flex' : 'none';
        populateFilters();
        resetAndRender();
    }

    // ★ 設定モーダル内データタブ切替
    function switchDataTab(tab) {
        document.getElementById('existing-data-section').style.display = tab==='existing' ? 'block' : 'none';
        document.getElementById('prospect-data-section').style.display = tab==='prospect' ? 'block' : 'none';
        document.getElementById('data-tab-existing').style.background = tab==='existing' ? 'var(--dark)' : '#f5f5f5';
        document.getElementById('data-tab-existing').style.color = tab==='existing' ? '#fff' : 'var(--text-sub)';
        document.getElementById('data-tab-prospect').style.background = tab==='prospect' ? 'var(--prospect-color)' : '#f5f5f5';
        document.getElementById('data-tab-prospect').style.color = tab==='prospect' ? '#fff' : 'var(--text-sub)';
    }

    window.onload = () => {
        const k = localStorage.getItem('map_apiKey');
        const d = localStorage.getItem(DB_NAME);
        const pd = localStorage.getItem(PROSPECT_DB_NAME);
        const tr = localStorage.getItem('map_target_reps_json');
        const qc = localStorage.getItem('map_quick_chips_json');

        if(tr) { try { targetReps = JSON.parse(tr); } catch(e) { targetReps=[]; } }
        if(qc) { try { quickChips = JSON.parse(qc); } catch(e) {} }
        if(d)  { try { db = JSON.parse(d); } catch(e){ db=[]; } }
        if(pd) { try { prospectDb = JSON.parse(pd); } catch(e){ prospectDb=[]; } }

        updateTabCounts();
        populateFilters();
        resetAndRender();

        if(k) {
            document.getElementById('apiKey').value = k;
            document.getElementById('map-placeholder-msg').innerText = "🔑 起動中...";
            setTimeout(() => initSystem(k), 500);
        } else {
            document.getElementById('map-placeholder-msg').innerHTML = "設定からAPIキーを<br>設定してください";
        }
        changeRegMode();
        // モバイル初期表示はマップ
        if(window.innerWidth < 900) { mobileGo('map'); }
    };

    function updateTabCounts() {
        document.getElementById('tab-existing-count').innerText = db.length;
        document.getElementById('tab-prospect-count').innerText = prospectDb.length;
    }

    // ★ 確度からピン色を返す
    function getProspectPinColor(confidence) {
        const c = (confidence||"").trim();
        if(c === '高') return '#4a7c59';
        if(c === '中') return '#82b896';
        return '#b2cdb9'; // 低 or 未設定
    }

    function getConfidenceClass(confidence) {
        const c = (confidence||"").trim();
        if(c === '高') return 'confidence-high';
        if(c === '中') return 'confidence-mid';
        return 'confidence-low';
    }

    function changeRegMode() {
        const mode = document.querySelector('input[name="regMode"]:checked').value;
        const updateOptions = document.getElementById('update-options');
        const label = document.getElementById('csv-label');
        const input = document.getElementById('csvInput');
        if(mode === 'new') {
            updateOptions.style.display = 'none';
            label.innerText = "データ貼り付け (kintoneからそのままコピー&ペースト)";
            input.placeholder = "坂田 悠介\tR001\t(株)ABC\t大宮店\t埼玉県...\tXXビル 3F\t090-1234-5678\t前金";
        } else {
            updateOptions.style.display = 'block';
            updatePlaceholder();
        }
    }

    function updatePlaceholder() {
        const target = document.getElementById('updateTarget').value;
        const label = document.getElementById('csv-label');
        const input = document.getElementById('csvInput');
        const targetText = document.querySelector(`#updateTarget option[value="${target}"]`).innerText;
        label.innerText = `データ貼り付け (2列: ID|${targetText.split(' ')[0]})`;
        let exVal = "新しい値";
        if(target==='credit') exVal="前金";
        if(target==='station') exVal="新宿";
        if(target==='tel') exVal="03-1234-5678";
        input.placeholder = `R001\t${exVal}\nR002\t${exVal}`;
    }

    function openSettings() {
        const modal = document.getElementById('settingsModal');
        const repList = document.getElementById('rep-checklist');
        repList.innerHTML = "";
        const allReps = [...new Set([...db, ...prospectDb].map(d => d.rep_name || "担当なし"))].sort();
        allReps.forEach(name => {
            const div = document.createElement('div'); div.style.padding = "4px 0";
            const isChecked = targetReps.includes(name) ? "checked" : "";
            div.innerHTML = `<label style="display:flex;align-items:center;cursor:pointer;margin:0;"><input type="checkbox" value="${name}" ${isChecked} onchange="toggleTargetRep(this)" style="width:auto;margin-right:8px;"> ${name}</label>`;
            repList.appendChild(div);
        });
        renderChipsSettings();

        const storageList = document.getElementById('storage-list'); storageList.innerHTML = "";
        for(let i=0; i<localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('map_db')) {
                const val = localStorage.getItem(key);
                let count = '?';
                try { count = JSON.parse(val).length + '件'; } catch(e) {}
                const div = document.createElement('div');
                div.style.display="flex"; div.style.justifyContent="space-between"; div.style.padding="8px"; div.style.borderBottom="1px solid #eee"; div.style.fontSize="0.8rem";
                div.innerHTML = `<div style="font-weight:500;">${key} <span style="color:var(--text-sub); font-size:0.7rem;">${count}</span></div><button onclick="forceDelete('${key}')" style="background:#fff;border:1px solid #ddd;border-radius:2px;font-size:0.7rem;padding:2px 8px;cursor:pointer;">削除</button>`;
                storageList.appendChild(div);
            }
        }
        modal.style.display = 'flex';
    }

    function renderChipsSettings() {
        const list = document.getElementById('settings-chip-list'); list.innerHTML = "";
        quickChips.forEach((c, idx) => {
            const span = document.createElement('span'); span.className = 'chip';
            span.innerHTML = `${c} <span class="chip-del" onclick="deleteChip(${idx})">×</span>`;
            list.appendChild(span);
        });
    }
    function addChip() {
        const input = document.getElementById('newChipInput');
        const val = input.value.trim();
        if(val) { quickChips.push(val); localStorage.setItem('map_quick_chips_json', JSON.stringify(quickChips)); input.value=""; renderChipsSettings(); }
    }
    function deleteChip(idx) {
        if(confirm("この定型文を削除しますか？")) { quickChips.splice(idx,1); localStorage.setItem('map_quick_chips_json', JSON.stringify(quickChips)); renderChipsSettings(); }
    }
    function toggleTargetRep(checkbox) {
        const name = checkbox.value;
        if(checkbox.checked) { if(!targetReps.includes(name)) targetReps.push(name); }
        else { targetReps = targetReps.filter(n => n !== name); }
        localStorage.setItem('map_target_reps_json', JSON.stringify(targetReps));
        render();
    }
    function forceDelete(key) {
        if(confirm(`"${key}" を削除しますか？`)) {
            localStorage.removeItem(key); openSettings();
            if(key === DB_NAME) { db = []; }
            if(key === PROSPECT_DB_NAME) { prospectDb = []; }
            updateTabCounts(); resetAndRender(); updateMapPins([]);
            alert("削除しました");
        }
    }

    async function saveKeyAndInit() { const k=document.getElementById('apiKey').value; if(!k) return alert("キーを入力してください"); localStorage.setItem('map_apiKey',k); await initSystem(k); alert("保存しました"); }

    async function initSystem(key) {
        if(window.google && window.google.maps && map) return;
        if(!window.google || !window.google.maps) {
            await new Promise((resolve, reject) => {
                if(document.querySelector('script[src*="maps.googleapis.com"]')) { setTimeout(resolve,1000); return; }
                const s = document.createElement('script');
                s.src = `https://maps.googleapis.com/maps/api/js?key=${key}&loading=async&libraries=places,geocoding,geometry,marker`;
                s.async = true; s.onload = resolve;
                s.onerror = (e) => { document.getElementById('map-placeholder-msg').innerText = "スクリプト読込エラー"; reject(e); };
                document.head.appendChild(s);
            });
        }
        try {
            const { Map } = await google.maps.importLibrary("maps");
            const { Geocoder } = await google.maps.importLibrary("geocoding");
            const { AdvancedMarkerElement: AM } = await google.maps.importLibrary("marker");
            geocoder = new Geocoder(); AdvancedMarkerElement = AM;
            const div = document.getElementById('google-map-view');
            map = new Map(div, { center:{lat:35.68,lng:139.76}, zoom:13, mapId:"DEMO_MAP_ID", mapTypeControl:false, streetViewControl:false });
            infoWindow = new google.maps.InfoWindow();
            map.addListener('idle', () => { if(!isPinClick && mapSyncMode) resetAndRender(); isPinClick=false; });
            map.addListener('dragstart', () => { if(watchId) { isTrackingLocked=false; updateGpsBtnState(); } });
            map.addListener('click', () => { if(highlightedId) { highlightedId=null; render(); } if(infoWindow) infoWindow.close(); });
            document.getElementById('map-placeholder-msg').style.display='none';
            if(db.length > 0 || prospectDb.length > 0) render();
        } catch(e) {
            document.getElementById('map-placeholder-msg').innerText = "初期化失敗 (リロード推奨)";
        }
    }

    function updateGpsBtnState() {
        const btn = document.getElementById('gpsBtn'); btn.className = 'btn-current-loc';
        if(watchId) { if(isTrackingLocked) btn.classList.add('locked'); else btn.classList.add('unlocked'); }
    }
    function toggleGPS() {
        if(!navigator.geolocation) return alert("位置情報が使えません");
        if(!map) return alert("先にAPIキーを設定してください");
        if(watchId) {
            if(isTrackingLocked) { navigator.geolocation.clearWatch(watchId); watchId=null; isTrackingLocked=false; if(myLocationMarker) { myLocationMarker.setMap(null); myLocationMarker=null; } }
            else { isTrackingLocked=true; if(myLocationMarker) map.panTo(myLocationMarker.position); }
        } else {
            isTrackingLocked = true;
            watchId = navigator.geolocation.watchPosition((pos) => {
                const loc = {lat:pos.coords.latitude, lng:pos.coords.longitude};
                if(myLocationMarker) { myLocationMarker.position=loc; }
                else {
                    const pin = document.createElement("div"); pin.style.width="18px"; pin.style.height="18px"; pin.style.backgroundColor="#4285F4"; pin.style.border="3px solid white"; pin.style.borderRadius="50%";
                    myLocationMarker = new AdvancedMarkerElement({map,position:loc,content:pin,title:"現在地",zIndex:999});
                }
                if(isTrackingLocked) map.panTo(loc);
                if(mapSyncMode) resetAndRender();
            }, ()=>{ alert("GPSエラー"); }, {enableHighAccuracy:true});
        }
        updateGpsBtnState();
    }

    function searchMapLocation() { smartSearch(); }
    function smartSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if(!q) return;
        // リストにヒットがあればリスト絞り込み優先、なければマップジャンプ
        const norm = normalize(q);
        const sourceDb = getCurrentDb();
        const hits = sourceDb.filter(d => normalize(d.name + d.r_code + d.rep_name + d.address).includes(norm));
        if(hits.length === 0 && geocoder && map) {
            // ヒットなし → エリア名としてマップジャンプ
            geocoder.geocode({address: q}, (results, status) => {
                if(status === 'OK') {
                    map.setCenter(results[0].geometry.location);
                    map.setZoom(14);
                    if(!mapSyncMode) {
                        document.getElementById('mapSyncToggle').checked = true;
                        toggleMapSync();
                    } else {
                        resetAndRender();
                    }
                }
            });
        }
        // ヒットあり → oninput が既に絞り込み済みなので何もしない
    }

    async function processData() {
        const mode = document.querySelector('input[name="regMode"]:checked').value;
        const csv = document.getElementById('csvInput').value.trim();
        if(!csv) return alert('データを貼り付けてください');
        const btn = document.getElementById('runBtn'); btn.disabled=true; btn.innerText="処理中...";
        if(mode==='update') {
            try {
                const targetField = document.getElementById('updateTarget').value;
                const lines = csv.split('\n'); let updateCount=0;
                for(let line of lines) {
                    const cols = line.trim().split(/\t/).map(s=>s.trim());
                    if(cols.length<2) continue;
                    const target = db.find(d=>d.r_code===cols[0]);
                    if(target) { target[targetField]=cols[1]; updateCount++; }
                }
                saveDB('existing'); render(); alert(`${updateCount} 件更新しました`);
            } finally { btn.disabled=false; btn.innerText="取り込み実行"; }
        } else {
            try {
                await initSystem(localStorage.getItem('map_apiKey'));
                const lines = csv.split('\n').filter(l=>l.trim());
                let count=0, updateCount=0, skipCount=0;

                const HEADER_MAP = {
                    '現在担当':'rep_name',
                    '顧客no':'r_code','顧客no.':'r_code',
                    '法人名':'corp_name',
                    '窓口店舗名':'store_name','店舗名':'store_name',
                    '住所':'address',
                    'ビル名':'building',
                    'tel':'tel','電話':'tel','責任者tel/携帯':'tel','責任者tel':'tel',
                    '与信':'credit',
                    '最寄り駅':'station',
                    'メモ':'note','責任者メモ':'note',
                };

                let colMap = null;
                let dataStartIdx = 0;
                const firstCols = lines[0].split(/\t/).map(s=>s.trim().toLowerCase());
                if(firstCols.some(c=>c.includes('顧客')||c.includes('現在担当'))) {
                    colMap = {};
                    firstCols.forEach((h,i)=>{ const key=h.replace(/\s/g,''); if(HEADER_MAP[key]) colMap[HEADER_MAP[key]]=i; });
                    dataStartIdx = 1;
                    log('ヘッダー自動検出: '+Object.keys(colMap).join(', '));
                }

                const g = (cols,field,fb) => {
                    if(colMap && colMap[field]!==undefined) return (cols[colMap[field]]||'').trim();
                    return (cols[fb]||'').trim();
                };

                for(let i=dataStartIdx; i<lines.length; i++) {
                    const cols = lines[i].split(/\t/).map(s=>s.trim());
                    if(cols.length<3) continue;
                    const repFromCsv=g(cols,'rep_name',0);
                    const r=g(cols,'r_code',1);
                    const corpName=g(cols,'corp_name',4);
                    const storeName=g(cols,'store_name',5);
                    const addr=g(cols,'address',6);
                    const build=g(cols,'building',colMap?999:5);
                    const tel=g(cols,'tel',8);
                    const credit=g(cols,'credit',colMap?999:7);
                    const station=g(cols,'station',99);
                    const note=g(cols,'note',99);
                    if(!r||!addr){skipCount++;continue;}
                    const name=(corpName+' '+storeName).trim();
                    const existing=db.find(d=>d.r_code===r);
                    if(existing){
                        existing.name=name;existing.building=build;existing.address=addr;
                        existing.tel=tel;existing.credit=credit;existing.rep_name=repFromCsv;
                        if(station)existing.station=station;
                        if(note)existing.note=note;
                        updateCount++;
                    } else {
                        try {
                            const coords=await new Promise((res,rej)=>geocoder.geocode({address:addr},(r,s)=>s==='OK'?res({lat:r[0].geometry.location.lat(),lng:r[0].geometry.location.lng()}):rej(s)));
                            db.push({id:Math.random().toString(36).substr(2,9),r_code:r,name,building:build,address:addr,tel,lat:coords.lat,lng:coords.lng,rep_name:repFromCsv,note,station,credit});
                            count++;log(`処理中... 新規:${count} 更新:${updateCount}`);
                        } catch(e){skipCount++;}
                        await new Promise(r=>setTimeout(r,400));
                    }
                }
                saveDB('existing');updateTabCounts();populateFilters();resetAndRender();
                alert(`完了: 新規 ${count} 件 / 更新 ${updateCount} 件`+(skipCount?` / スキップ ${skipCount} 件`:''));
            } finally { btn.disabled=false; btn.innerText="取り込み実行"; }
        }
    }

    // ★ CSVエクスポート
    function exportCSV(type) {
        const data = type==='existing' ? db : prospectDb;
        if(!data.length) return alert('データがありません');
        const header = type==='existing'
            ? 'ID,社名店名,住所,ビル名,電話,与信,最寄り駅,メモ,担当者'
            : 'ID,社名店名,住所,ビル名,電話,確度,最寄り駅,メモ,担当者';
        const rows = data.map(d => [d.r_code,d.name,d.address,d.building,d.tel,d.credit,d.station,d.note,d.rep_name].map(v=>`"${(v||"").replace(/"/g,'""')}"`).join(','));
        const csv = [header, ...rows].join('\n');
        const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=`${type==='existing'?'顧客':'見込み顧客'}_${new Date().toISOString().slice(0,10)}.csv`; a.click();

        const url = URL.createObjectURL(blob);

    function uploadData(input, type) {
        const f=input.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=e=>{
            try {
                if(confirm("JSONファイルを読み込みますか？")) {
                    const parsed = JSON.parse(e.target.result);
                    if(type==='existing') { db=parsed; saveDB('existing'); }
                    else { prospectDb=parsed; saveDB('prospect'); }
                    updateTabCounts(); populateFilters(); resetAndRender(); alert("読み込み完了");
                }
            } catch(z) { alert("読み込み失敗"); }
        };
        r.readAsText(f);

            if(type==='existing') { db=[]; saveDB('existing'); }
            else { prospectDb=[]; saveDB('prospect'); }
            updateTabCounts(); resetAndRender(); updateMapPins([]);
        }

    function updateMapPins(displayTargets) {
        if(!map || !AdvancedMarkerElement) return;
        markers.forEach(m=>m.setMap(null)); markers=[];
        const bounds = new google.maps.LatLngBounds(); let hasPin=false;
        const searchInput = normalize(document.getElementById('searchInput').value);
        const hasSearch = searchInput.length>0;

        let pinsToShow = displayTargets;
        if(mapSyncMode && map) {
            const fPref = document.getElementById('prefFilter').value;
                const sourceDb = getCurrentDb();
            const mapBaseData = sourceDb.filter(d => {
                if(fPref!=='ALL' && getPrefecture(d.address)!==fPref) return false;
                if(fSt!=='ALL' && (d.station||"")!==fSt) return false;
                return true;
            });
            const center = map.getCenter();
            mapBaseData.forEach(d=>d._dist=google.maps.geometry.spherical.computeDistanceBetween(center,new google.maps.LatLng(d.lat,d.lng)));
            mapBaseData.sort((a,b)=>a._dist-b._dist);
            const val = document.getElementById('limitSelect').value;
            const limit = (val==='ALL') ? mapBaseData.length : parseInt(val);
            pinsToShow = mapBaseData.slice(0,limit);
        }

        const grouped={};
        pinsToShow.forEach(c=>{
            if(c.lat&&c.lng) { const key=`${c.lat.toFixed(6)},${c.lng.toFixed(6)}`; if(!grouped[key]) grouped[key]=[]; grouped[key].push(c); }
        });

        Object.keys(grouped).forEach(key=>{
            const group=grouped[key]; const first=group[0];
            let isMe = group.some(c=>targetReps.includes(c.rep_name));
            let isHit = group.some(c=>hasSearch&&normalize(c.name+c.r_code).includes(searchInput));
            let isHighlighted = group.some(c=>c.id===highlightedId);

            const pinView=document.createElement("div");
            const size = (isHit||isHighlighted) ? "20px" : "14px";
            pinView.style.width=size; pinView.style.height=size;

            let bgColor;
            if(isHighlighted || isHit) bgColor='#FFD60A';
            else if(isMe) bgColor='#5d7ea3';
            else if(currentTab==='prospect') bgColor=getProspectPinColor(first.credit);
            else bgColor='#bf5b5b';

            pinView.style.backgroundColor=bgColor;
            pinView.style.borderRadius="50%"; pinView.style.border="2px solid white"; pinView.style.boxShadow="0 2px 5px rgba(0,0,0,0.2)";
            if(hasSearch&&!isHit&&!isHighlighted) pinView.style.opacity="0.5";

            const m=new AdvancedMarkerElement({position:{lat:first.lat,lng:first.lng},map,content:pinView,zIndex:(isHit||isHighlighted)?1000:(isMe?100:1)});
            m.addListener("click",()=>{
                isPinClick=true;
                let html='<div class="info-window-container">';
                group.forEach(c=>{
                    const telBtn=c.tel?`<a href="tel:${c.tel}" class="info-tel">📞 ${c.tel}</a>`:"";
                    const note=c.note?`<div style="background:#fcf8e3;padding:4px;font-size:0.75rem;margin-bottom:4px;border-radius:2px;color:#8a6d3b;">${c.note}</div>`:"";
                    const build=c.building?`<div style="font-size:0.8rem;color:#444;margin-bottom:2px;font-weight:bold;">${c.building}</div>`:"";
                    const creditLabel = c.isProspect ? `確度:${c.credit}` : c.credit;
                    const creditHtml=c.credit?`<span style="color:${c.isProspect?'var(--prospect-color)':'#c62828'}; font-weight:bold; margin-left:4px;">【${creditLabel}】</span>`:"";
                    html+=`<div class="info-window-card"><div class="info-title">${c.name}${creditHtml}</div><div class="info-meta">${c.rep_name} / ${c.r_code}</div>${telBtn}${build}<div class="info-addr">${c.address}</div>${note}<button class="info-btn btn-edit-sm" onclick="openEdit('${c.id}')">編集</button></div>`;
                });
                html+='</div>';
                infoWindow.setContent(html); infoWindow.open(map,m);
            });
            markers.push(m); bounds.extend(m.position); hasPin=true;
        });
        if(hasPin&&!mapSyncMode&&!watchId) map.fitBounds(bounds);
    }

            if(!q) return true;

                    編集

                <a href="tel:${c.tel}" class="action-btn ${isProspectTab?'prospect-btn':''}">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.053 15.053 0 0 1-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1.01A11.36 11.36 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/></svg>
                    発信

    function panToMap(id,lat,lng) {

    function openEdit(id) {
        const sourceDb=getCurrentDb();
        const d=sourceDb.find(x=>x.id===id); if(!d) return;
        document.getElementById('edit-id').value=d.id;
        document.getElementById('edit-type').value=currentTab;
        document.getElementById('edit-note').value=d.note||"";
        document.getElementById('edit-rep').value=d.rep_name||"";
        document.getElementById('edit-r').value=d.r_code||"";
        document.getElementById('edit-name').value=d.name;
        document.getElementById('edit-building').value=d.building||"";
        document.getElementById('edit-tel').value=d.tel||"";
        document.getElementById('edit-addr').value=d.address;
        document.getElementById('edit-station').value=d.station||"";
        document.getElementById('edit-credit').value=d.credit||"";
        document.getElementById('orig-addr').value=d.address;

        const chipArea=document.getElementById('edit-chip-area'); chipArea.innerHTML="";
        quickChips.forEach(t=>{ const sp=document.createElement('span'); sp.className='chip'; sp.innerText=t; sp.onclick=()=>addNote(t); chipArea.appendChild(sp); });
        const clr=document.createElement('span'); clr.className='chip'; clr.innerText='クリア'; clr.onclick=()=>document.getElementById('edit-note').value=''; chipArea.appendChild(clr);
        document.getElementById('editModal').style.display='flex';
    }

    function closeModal() { document.getElementById('editModal').style.display='none'; }

    async function saveEdit() {
        const id=document.getElementById('edit-id').value;
        const type=document.getElementById('edit-type').value;
        const targetDb = type==='existing' ? db : prospectDb;
        const idx=targetDb.findIndex(x=>x.id===id); if(idx===-1) return;
        const newAddr=document.getElementById('edit-addr').value.trim();
        const oldAddr=document.getElementById('orig-addr').value;
        targetDb[idx].note=document.getElementById('edit-note').value;
        targetDb[idx].rep_name=document.getElementById('edit-rep').value;
        targetDb[idx].r_code=document.getElementById('edit-r').value;
        targetDb[idx].name=document.getElementById('edit-name').value;
        targetDb[idx].building=document.getElementById('edit-building').value;
        targetDb[idx].tel=document.getElementById('edit-tel').value;
        targetDb[idx].address=newAddr;
        targetDb[idx].station=document.getElementById('edit-station').value;
        targetDb[idx].credit=document.getElementById('edit-credit').value;
        if(newAddr!==oldAddr&&newAddr!==""&&geocoder) {
            try {
                const coords=await new Promise((resolve,reject)=>{ geocoder.geocode({address:newAddr},(results,status)=>{ if(status==='OK') resolve({lat:results[0].geometry.location.lat(),lng:results[0].geometry.location.lng()}); else reject(status); }); });
                targetDb[idx].lat=coords.lat; targetDb[idx].lng=coords.lng;
            } catch(e) { alert("住所のマップ座標更新に失敗しました。テキストのみ更新します。"); }
        }
        saveDB(type); populateFilters(); render(); closeModal();
    }

    function deleteCustomer() {
        if(confirm("このデータを削除しますか？")) {
            const type=document.getElementById('edit-type').value;
            const id=document.getElementById('edit-id').value;
            if(type==='existing') db=db.filter(x=>x.id!==id);
            else prospectDb=prospectDb.filter(x=>x.id!==id);
            saveDB(type); updateTabCounts(); render(); closeModal();
        }
    }
    // PWA Service Worker
    if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW error:', e));
    }
    let _pwa;
    window.addEventListener('beforeinstallprompt',e=>{
        e.preventDefault();_pwa=e;
        if(window.innerWidth<900){
            const b=document.createElement('button');
            b.className='mbar-btn';b.style.color='#4a7c59';
            b.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>追加</span>';
            b.onclick=()=>{_pwa.prompt();b.remove();};
            document.getElementById('mobileBar').appendChild(b);
        }
    });
</script>
</body>
